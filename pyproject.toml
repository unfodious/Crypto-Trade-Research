[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "crypto-trade-research"
version = "0.1.0"
description = "Research-only ML and meta-strategy pipeline for Crypto Trade."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Crypto Trade Team" }]
dependencies = [
  "pyarrow>=16.0",
  "websockets>=13.0",
]

[project.scripts]
crypto-trade-ingest-market-dataset = "crypto_trade_research.data.ingestion:main"
crypto-trade-ingest-funding-rates = "crypto_trade_research.data.funding:main"
crypto-trade-ingest-binance-futures-metrics = "crypto_trade_research.data.binance_futures_metrics:main"
crypto-trade-collect-binance-crowding = "crypto_trade_research.data.binance_crowding:main"
crypto-trade-collect-binance-order-book = "crypto_trade_research.data.binance_order_book:main"
crypto-trade-collect-binance-liquidations = "crypto_trade_research.data.binance_liquidations:main"
crypto-trade-build-external-forward-features = "crypto_trade_research.data.external_forward_features:main"
crypto-trade-build-evidence-readiness = "crypto_trade_research.evidence_readiness:main"
crypto-trade-build-forward-filter-diagnostics = "crypto_trade_research.forward_filter_diagnostics:main"
crypto-trade-ingest-hyperliquid-whales = "crypto_trade_research.data.hyperliquid_whales:main"
crypto-trade-run-hyperliquid-watchlist = "crypto_trade_research.data.hyperliquid_watchlist:main"
crypto-trade-experiments = "crypto_trade_research.tracking.registry:main"
crypto-trade-run-batch-experiments = "crypto_trade_research.experiments.batch:main"
crypto-trade-run-baseline-experiment = "crypto_trade_research.experiments.runner:main"
crypto-trade-write-stability-report = "crypto_trade_research.evaluation.stability:main"
crypto-trade-build-paper-pack = "crypto_trade_research.paper_trading:main"
crypto-trade-build-paper-monitoring-report = "crypto_trade_research.paper_monitoring:main"
crypto-trade-run-paper-collector = "crypto_trade_research.paper_collector:main"
crypto-trade-run-forward-paper = "crypto_trade_research.paper_forward:main"
crypto-trade-research-stream-health = "crypto_trade_research.research_stream_health:main"
crypto-trade-run-historical-holdout-replay = "crypto_trade_research.historical_holdout_replay:main"
crypto-trade-build-selected-trade-abstention = "crypto_trade_research.selected_trade_abstention:main"
crypto-trade-build-futures-metrics-selected-features = "crypto_trade_research.futures_metrics_selected_features:main"
crypto-trade-build-sizing-stress = "crypto_trade_research.sizing_stress:main"
crypto-trade-build-adaptive-sizing = "crypto_trade_research.adaptive_sizing:main"
crypto-trade-build-monthly-target = "crypto_trade_research.monthly_target:main"
crypto-trade-build-payoff-diagnostics = "crypto_trade_research.payoff_diagnostics:main"
crypto-trade-build-timeframe-continuation-scan = "crypto_trade_research.timeframe_continuation_scan:main"
crypto-trade-build-forward-skip-counterfactual = "crypto_trade_research.forward_skip_counterfactual:main"
crypto-trade-build-spot-drawdown-swing = "crypto_trade_research.spot_drawdown_swing:main"
crypto-trade-build-spot-aggtrade-flow = "crypto_trade_research.spot_aggtrade_flow:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.8",
]
research = [
  "numpy>=2.0",
  "pandas>=2.2",
  "polars>=1.0",
  "scikit-learn>=1.5",
  "scipy>=1.14",
]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
