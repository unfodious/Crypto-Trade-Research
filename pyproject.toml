[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "crypto-trade-research"
version = "0.1.0"
description = "Research-only ML and meta-strategy pipeline for Crypto Trade."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Crypto Trade Team" }]
dependencies = [
  "pyarrow>=16.0",
]

[project.scripts]
crypto-trade-ingest-market-dataset = "crypto_trade_research.data.ingestion:main"
crypto-trade-experiments = "crypto_trade_research.tracking.registry:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.8",
]
research = [
  "numpy>=2.0",
  "pandas>=2.2",
  "polars>=1.0",
  "scikit-learn>=1.5",
  "scipy>=1.14",
]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
